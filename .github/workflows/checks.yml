name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Contracts, repository policy and author journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAFLOOM_CANDIDATE_REPORT: .leafloom/ci/candidate-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Includes immutable pinned NEO bytes and dependency-direction checks.
      - run: pnpm check:ci
      - run: pnpm exec playwright install --with-deps chromium
      - name: Production headless author journeys
        run: pnpm test:neo-candidate --grep-invert 'Leafloom production performance:'
      - name: Retain actual browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-author-journeys
          path: |
            .leafloom/ci/candidate-results.json
            .leafloom/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  writing-performance:
    name: Native typing and durable save performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEAFLOOM_CANDIDATE_REPORT: .leafloom/ci/performance-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Fresh process and synthetic library: previous journey fixtures do not
      # become background work in the measured writing workload.
      - run: pnpm test:neo-candidate --grep 'Leafloom production performance:'
      - name: Retain measured writing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-performance
          path: |
            .leafloom/ci/performance-results.json
            .leafloom/test-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  desktop-compile:
    name: Tauri compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfontconfig1-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Compile native host without launching or signing
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
