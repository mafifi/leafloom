[package]
name = "leafloom-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable", "webview-data-url"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = {version="=1.23.0",features= ["v4"] }
base64 = "=0.22.1"
open = "=5.4.2"
image = {version="=0.25.10",default-features=false,features= ["webp"] }
rfd = "=0.15.4"
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-wdio = { version = "=1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = {version="=3.6.3",features= ["apple-native"] }
objc2-foundation = "=0.3.2"
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", features = ["NSPasteboard"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = {version="=3.6.3",features= ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
arboard = {version="=3.6.1",default-features=false}
font-kit = "=0.14.3"
trash = "=5.2.9"

[features]
default = []
native-test = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization"] }
